spring:
  application:
    name: nutricare-api
  config:
    import: optional:file:.env[.properties]
  flyway:
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/migration-dev

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nutricare}
    username: ${DB_USERNAME:nutricare}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: nutricare-pool
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 20000
  jpa:
    hibernate:
      ddl-auto: validate
