spring:
  datasource:
    url: jdbc:h2:mem:nutricare;MODE=PostgreSQL
  flyway:
    locations: classpath:db/migration
    target: "2.1"
  jpa:
    hibernate:
      ddl-auto: validate

app:
  jwt:
    secret: test-secret-not-for-production-use-only-in-tests
    expiration-minutes: 60
    refresh-token-expiration-days: 7

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,prometheus
  endpoint:
    health:
      show-details: when-authorized
